[project]
name = "dbupgrade"
version = "2026.8.0.dev0"
description = "Database Migration Tool"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Sebastian Rittau", email = "srittau@rittau.biz" }]
requires-python = ">=3.10"
dependencies = ["sqlalchemy >= 2.0.51, <3", "sqlparse >= 0.6.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development",
]

[project.urls]
homepage = "https://github.com/srittau/dbupgrade"
repository = "https://github.com/srittau/dbupgrade"
"GitHub" = "https://github.com/srittau/dbupgrade"
"Bug Tracker" = "https://github.com/srittau/dbupgrade/issues"
"Changes" = "https://github.com/srittau/dbupgrade/blob/main/CHANGELOG.md"

[project.scripts]
dbupgrade = 'dbupgrade.main:main'

[dependency-groups]
dev = [
    "mypy ~= 1.18.2",
    "pytest >= 9.1.1",
    "pytest-mock >= 3.15.1, < 4",
    "ruff ~= 0.14.14",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbupgrade"
module-root = ""
source-include = ["CHANGELOG.md"]

[tool.pytest]
python_files = ["test_*/*.py"]

[tool.mypy]
disallow_any_decorated = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
ignore_missing_imports = true      # TODO: due to sqlparse
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
# E501: line too long (handled by ruff formatter)
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
